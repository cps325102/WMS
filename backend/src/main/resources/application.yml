server:
  port: 8080

spring:
  application:
    name: wms

  # 数据库连接。凭据全部来自环境变量，缺省值对应 db/setup.sql 里创建的专用账号。
  # 覆盖方式：WMS_DB_HOST / WMS_DB_PORT / WMS_DB_NAME / WMS_DB_USER / WMS_DB_PASSWORD
  datasource:
    url: jdbc:mysql://${WMS_DB_HOST:localhost}:${WMS_DB_PORT:3306}/${WMS_DB_NAME:wms}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${WMS_DB_USER:wms}
    password: ${WMS_DB_PASSWORD:Wms@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 10000
      pool-name: WmsPool

  # 建表脚本与种子数据随启动执行：
  #   schema.sql 全部是 CREATE TABLE IF NOT EXISTS，可重复执行；
  #   data.sql 用 INSERT IGNORE，靠各表 UNIQUE 约束保证不会重复插入。
  sql:
    init:
      mode: always
      encoding: UTF-8
      continue-on-error: false

logging:
  level:
    root: info
    com.example.wms: info
